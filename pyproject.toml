[project]
name = "wikidata-agent"
version = "0.1.0"
description = "An agent-based natural-language interface for Wikidata"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai-agents>=0.23.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
